[project]
name = "nim-intelligence-orchestrator"
version = "0.1.0"
description = "Intelligence orchestration layer above nim-multi-key-router: multi-model generation, external verification, debate, and benchmarking"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
nim-orch = "nim_orchestrator.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
