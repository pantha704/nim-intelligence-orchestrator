- id: sealed-coding-006
  category: coding
  question: Write a Python function max_subarray(nums) returning the maximum subarray
    sum (Kadane).
  check: code
  risk_level: medium
  expected:
  - def max_subarray
  tests: "```python\ndef test_max_subarray():\n    assert max_subarray([-2, 1, -3,\
    \ 4, -1, 2, 1, -5, 4]) == 6\n```"
- id: sealed-coding-007
  category: coding
  question: Write a Python function group_anagrams(words) grouping anagrams together.
  check: code
  risk_level: medium
  expected:
  - def group_anagrams
  tests: "```python\ndef test_group_anagrams():\n    out = group_anagrams(['eat',\
    \ 'tea', 'tan'])\n    assert any(set(g) == {'eat', 'tea'} for g in out)\n```"
- id: sealed-coding-008
  category: coding
  question: Write a Python function is_balanced(s) checking balanced parentheses/brackets/braces.
  check: code
  risk_level: medium
  expected:
  - def is_balanced
  tests: "```python\ndef test_is_balanced():\n    assert is_balanced('([])') is True\n\
    \    assert is_balanced('([)]') is False\n```"
- id: sealed-coding-009
  category: coding
  question: Write a Python function kth_smallest(nums, k) returning the k-th smallest
    element.
  check: code
  risk_level: medium
  expected:
  - def kth_smallest
  tests: "```python\ndef test_kth_smallest():\n    assert kth_smallest([3, 1, 2],\
    \ 2) == 2\n```"
- id: sealed-coding-010
  category: coding
  question: Write a Python function is_valid_ipv4(s) validating an IPv4 address string.
  check: code
  risk_level: medium
  expected:
  - def is_valid_ipv4
  tests: "```python\ndef test_is_valid_ipv4():\n    assert is_valid_ipv4('192.168.0.1')\
    \ is True\n    assert is_valid_ipv4('256.1.1.1') is False\n```"
- id: sealed-debuggin-011
  category: debugging
  question: "Fix this function: it should return the count of True values in the list.\n\
    ```python\ndef count_true(flags):\n    return sum(1 for f in flags if not f)\n\
    ```"
  check: debug
  risk_level: medium
  expected:
  - def count_true
  tests: "```python\ndef test_count_true():\n    assert count_true([True, False, True])\
    \ == 2\n```"
- id: sealed-debuggin-012
  category: debugging
  question: "Fix the boundary: it should return the second-largest number, or None\
    \ if fewer than 2.\n```python\ndef second_largest(nums):\n    nums.sort()\n  \
    \  return nums[-2]\n```"
  check: debug
  risk_level: medium
  expected:
  - def second_largest
  tests: "```python\ndef test_second_largest():\n    assert second_largest([3, 1,\
    \ 2]) == 2\n    assert second_largest([5]) is None\n```"
- id: sealed-debuggin-013
  category: debugging
  question: "Fix the string handling: it should return 'yes' when s contains a digit.\n\
    ```python\ndef has_digit(s):\n    return any(c.isdigit() for c in s) and 'yes'\
    \ or 'no'\n```"
  check: debug
  risk_level: medium
  expected:
  - def has_digit
  tests: "```python\ndef test_has_digit():\n    assert has_digit('ab3') == 'yes'\n\
    \    assert has_digit('abc') == 'no'\n```"
- id: sealed-debuggin-014
  category: debugging
  question: "Fix the off-by-one: it should return the sum of numbers from 1 to n inclusive.\n\
    ```python\ndef sum_to(n):\n    return sum(range(n))\n```"
  check: debug
  risk_level: medium
  expected:
  - def sum_to
  tests: "```python\ndef test_sum_to():\n    assert sum_to(4) == 10\n    assert sum_to(0)\
    \ == 0\n```"
- id: sealed-debuggin-015
  category: debugging
  question: "Fix the comparison: it should return True when all elements are positive.\n\
    ```python\ndef all_positive(nums):\n    return all(n > 0 for n in nums) or len(nums)\
    \ == 0\n```\nEmpty list should be True."
  check: debug
  risk_level: medium
  expected:
  - def all_positive
  tests: "```python\ndef test_all_positive():\n    assert all_positive([1, 2]) is\
    \ True\n    assert all_positive([1, -1]) is False\n```"
